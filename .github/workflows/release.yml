name: Release

# Builds the installers on every version tag and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Le tag correspond à la version de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; fi
      - run: npm ci
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, script: 'dist:mac', files: 'dist/*.dmg' }
          - { name: Linux, os: ubuntu-latest, script: 'dist:linux', files: "dist/*.AppImage\ndist/*.deb" }
          - { name: Windows, os: windows-latest, script: 'dist:win', files: "dist/*.exe\ndist/latest.yml\ndist/*.blockmap" }
    env:
      # true when the Apple signing secrets exist (not on forks): macOS is then signed with the Developer ID
      # certificate and notarized, otherwise it falls back to the unsigned (ad hoc) build.
      HAS_APPLE_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (unsigned)
        if: ${{ !(matrix.name == 'macOS' && env.HAS_APPLE_SIGNING == 'true') }}
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # pas de certificat : build non signé (signature ad hoc sur macOS)
      - name: Import the Developer ID certificate (macOS)
        if: ${{ matrix.name == 'macOS' && env.HAS_APPLE_SIGNING == 'true' }}
        # A dedicated keychain, set up here rather than by electron-builder: its own import step runs
        # `security set-key-partition-list` with the .p12 password as the keychain password, which fails on recent runners.
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/cyberdog-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Build (macOS, Developer ID signed and notarized)
        if: ${{ matrix.name == 'macOS' && env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npm run dist:mac:signed
          rm -f "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Check the macOS signature and notarization
        if: ${{ matrix.name == 'macOS' && env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          for app in dist/mac*/Cyberdog.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done
      - name: Remove the signing keychain
        if: ${{ always() && matrix.name == 'macOS' && env.HAS_APPLE_SIGNING == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/cyberdog-signing.keychain-db" || true
      - uses: actions/upload-artifact@v7
        with:
          name: cyberdog-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" assets/* --title "Cyberdog ${GITHUB_REF_NAME#v}" --generate-notes $PRERELEASE
