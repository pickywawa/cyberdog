name: Community builds

# Public workflows build Community artifacts only; no private source or credentials are fetched.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Le tag correspond à la version de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; fi
      - run: npm ci
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, script: 'dist:mac', files: 'dist/*.dmg' }
          - { name: Windows, os: windows-latest, script: 'dist:win', files: "dist/*.exe\ndist/latest.yml\ndist/*.blockmap" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # pas de certificat : build non signé (signature ad hoc sur macOS)
      - uses: actions/upload-artifact@v7
        with:
          name: cyberdog-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

# Official Premium releases are assembled and published from the private repository.
