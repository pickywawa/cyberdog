# GitLab CI/CD pour Cyberdog
#
#   test           à chaque push / merge request : tests unitaires
#   build:windows  sur tag vX.Y.Z (manuel sur une branche) : installeur NSIS + portable, construits sous Linux avec wine
#   build:macos    manuel, nécessite un runner macOS (tag « macos ») : .dmg arm64 + x64
#   release        sur tag : crée la Release GitLab avec les fichiers publiés dans le Package Registry
#
# Publier une version :   npm version patch && git push --follow-tags
#
# Variables à adapter dans Settings > CI/CD > Variables si votre GitLab n'accède pas à Docker Hub :
#   NODE_IMAGE, BUILDER_IMAGE  (ex. un miroir interne ou le Dependency Proxy)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  NODE_IMAGE: node:22
  BUILDER_IMAGE: electronuserland/builder:22-wine
  npm_config_cache: $CI_PROJECT_DIR/.npm
  ELECTRON_CACHE: $CI_PROJECT_DIR/.cache/electron
  ELECTRON_BUILDER_CACHE: $CI_PROJECT_DIR/.cache/electron-builder

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/, .cache/]

stages: [test, build, release]

test:
  stage: test
  image: $NODE_IMAGE
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # les tests n'ont pas besoin du binaire Electron
  script:
    - npm ci
    - npm test
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PKG="v$(node -p "require('./package.json').version")"
        [ "$PKG" = "$CI_COMMIT_TAG" ] || { echo "Le tag $CI_COMMIT_TAG ne correspond pas à package.json ($PKG)"; exit 1; }
      fi

build:windows:
  stage: build
  image: $BUILDER_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  variables:
    CSC_IDENTITY_AUTO_DISCOVERY: 'false' # build non signé
  script:
    - npm ci
    - npm run dist:win
    - (cd dist && sha256sum *.exe > SHA256SUMS-windows.txt)
    - if [ -n "$CI_COMMIT_TAG" ]; then sh ci/upload.sh dist/*.exe dist/SHA256SUMS-windows.txt; fi
  artifacts:
    paths: [dist/*.exe, dist/SHA256SUMS-windows.txt]
    expire_in: 30 days

# Les .dmg ne se construisent que sur macOS : ce job attend un runner portant le tag « macos ».
# Sans runner macOS, il reste simplement manuel et la release ne contient que les fichiers Windows ;
# il peut aussi être remplacé par un `npm run dist:mac` local (voir README).
build:macos:
  stage: build
  tags: [macos]
  rules:
    - when: manual
      allow_failure: true
  variables:
    CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  script:
    - npm ci
    - npm run dist:mac
    - (cd dist && shasum -a 256 *.dmg > SHA256SUMS-macos.txt)
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        sh ci/upload.sh dist/*.dmg dist/SHA256SUMS-macos.txt
        node ci/publish-release.mjs # ajoute les .dmg à la release déjà créée
      fi
  artifacts:
    paths: [dist/*.dmg, dist/SHA256SUMS-macos.txt]
    expire_in: 30 days

release:
  stage: release
  image: $NODE_IMAGE
  needs:
    - job: build:windows
      artifacts: false # les fichiers sont déjà dans le Package Registry
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - node ci/publish-release.mjs
